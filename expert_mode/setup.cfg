[metadata]
name = agent-security-skill-scanner
version = 1.0.0
description = AI Agent Security Skill Scanner - Autonomous Security Detection System
author = Agent Security Team
license = MIT

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pyyaml>=6.0
    requests>=2.28.0
    fastapi>=0.100.0
    uvicorn>=0.23.0
    scikit-learn>=1.3.0
    numpy>=1.24.0
    pandas>=2.0.0
    watchdog>=3.0.0
    tqdm>=4.65.0
    rich>=13.0.0

[options.entry_points]
console_scripts =
    lingshun = round30.autonomous_security:main
    lingshun-daemon = round14.lingshun_daemon:main
    validate-quality = quality_validator:main

[options.packages.find]
exclude =
    tests*
    round*/results*
    round*/reports*
