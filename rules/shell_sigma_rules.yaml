title: Shell/Bash Malicious Activity Detection
status: stable
level: high
description: Detects Shell/Bash malicious activities including remote code execution, data exfiltration, and persistence
author: Scanner V3
date: 2026-03-24
tags:
  - attack.execution
  - attack.t1059
  - attack.t1041
  - attack.t1053
logsource:
  category: process
  product: bash
detection:
  selection_remote_exec_curl:
    command_line|contains:
      - 'curl'
      - '|'
      - 'bash'
  selection_remote_exec_wget:
    command_line|contains:
      - 'wget'
      - '|'
      - 'bash'
  selection_data_exfil:
    command_line|contains:
      - 'cat'
      - '|'
      - 'nc '
      - 'netcat'
  selection_persistence:
    command_line|contains:
      - 'echo'
      - '>> ~/.bashrc'
      - '>> ~/.profile'
  selection_credential_theft:
    command_line|contains:
      - 'cat'
      - '.ssh/id_rsa'
  condition: selection_remote_exec_curl or selection_remote_exec_wget or selection_data_exfil or selection_persistence or selection_credential_theft
falsepositives:
  - Legitimate system administration scripts
  - DevOps automation scripts
  - CI/CD pipelines
level: high
