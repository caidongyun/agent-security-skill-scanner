title: 远程代码加载
id: RE-SIGMA-001
status: stable
level: high
description: 检测远程代码加载攻击
author: Agent Security Skill Scanner
date: 2026-03-17
tags:
  - attack.remote_load
  - security.RE-SIGMA-001
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine0: "*curl|bash*"
    CommandLine1: "*wget|sh*"
    CommandLine2: "*curl -fsSL*"
  condition: selection
falsepositives:
  - Legitimate administrative scripts
fields:
  - CommandLine
  - ParentCommandLine
  - User
