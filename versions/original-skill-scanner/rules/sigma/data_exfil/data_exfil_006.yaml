title: 环境变量窃取
id: DA-SIGMA-006
status: stable
level: medium
description: 检测环境变量窃取攻击
author: Agent Security Skill Scanner
date: 2026-03-17
tags:
  - attack.data_exfil
  - security.DA-SIGMA-006
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine0: "*os.environ*"
    CommandLine1: "*process.env*"
    CommandLine2: "*getenv(*"
  condition: selection
falsepositives:
  - Legitimate administrative scripts
fields:
  - CommandLine
  - ParentCommandLine
  - User
